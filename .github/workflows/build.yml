name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (macOS, x64 + arm64 on Apple hardware)
        if: startsWith(matrix.os, 'macos')
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Build (Linux x64)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Build (Windows x64)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamelib-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts/
          gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber

# triggers: manual (workflow_dispatch) or v* tags
